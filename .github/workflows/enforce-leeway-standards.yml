# LEEWAY HEADER — DO NOT REMOVE
# REGION: CORE.CI.GOVERNANCE
# TAG: CORE.CI.STANDARDS_ENFORCEMENT.MAIN
# DISCOVERY_PIPELINE: Voice → Intent → Location → Vertical → Ranking → Render
# 5WH:
# WHAT = Govern whole-repository file compliance admission
# WHY = Preserve the proposed strict compliance policy in a reviewable isolated change
# WHO = LeeWay Standards engineering
# WHERE = .github/workflows/enforce-leeway-standards.yml
# WHEN = 2026-10-25
# HOW = GitHub Actions runs canonical read-only scanner and rejects every flagged or invalid governed file
# LICENSE: Existing repository terms remain unchanged
name: Enforce LeeWay Standards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  enforce-standards:
    runs-on: ubuntu-latest
    name: LeeWay Standards Enforcement
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Standards enforcer safety and portability
        run: node --test tests/*.test.mjs

      - name: Run LeeWay File Governance Enforcer (Report Mode)
        id: scan
        run: |
          node scripts/auto-enforce-file-governance.mjs --root . > enforcement-report.json 2>&1
          cat enforcement-report.json
        continue-on-error: true

      - name: Validate 100 Percent Source Compliance
        run: |
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('enforcement-report.json', 'utf8'));
          const scanned = report.scanned || 0;
          const changed = report.changed || 0;
          const invalid = report.invalid || 0;
          const records = report.results || [];
          const malformed = !Array.isArray(records) || records.length !== scanned;
          console.log('LeeWay strict admission:', {scanned, changed, invalid, malformed});
          if (scanned === 0 || changed !== 0 || invalid !== 0 || malformed) {
            console.error('STRICT_ADMISSION_FAILED: all scanned governed source must comply; no threshold rounding');
            process.exit(1);
          }
          console.log('STRICT_ADMISSION_PASS: 100% of scanned governed files compliant');
          "

      - name: Preserve read-only enforcement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeway-governance-report
          path: enforcement-report.json
          if-no-files-found: error
          retention-days: 30

  blocking-gate:
    runs-on: ubuntu-latest
    name: Admission Gate Validation
    needs: enforce-standards
    if: always()
    steps:
      - name: Verify Enforcement Passed
        if: needs.enforce-standards.result != 'success'
        run: |
          echo "❌ Standards enforcement failed - build cannot proceed"
          exit 1
      - name: ✅ All Gates Passed
        run: |
          echo "✅ Code passed all LeeWay Standards gates"
