# LEEWAY HEADER — DO NOT REMOVE
# REGION: CORE.CI.GOVERNANCE
# TAG: CORE.CI.STANDARDS_ENFORCEMENT.MAIN
# DISCOVERY_PIPELINE: Voice → Intent → Location → Vertical → Ranking → Render
# 5WH:
# WHAT = Enforce the existing LeeWay source compliance gate in GitHub Actions
# WHY = Prevent unqualified code and document changes from being admitted
# WHO = LeeWay Standards engineering
# WHERE = .github/workflows/enforce-leeway-standards.yml
# WHEN = 2026-10-14 (review of existing workflow)
# HOW = GitHub Actions runs the canonical file governance enforcer and tests
# LICENSE:
# MIT
name: Enforce LeeWay Standards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  enforce-standards:
    runs-on: ubuntu-latest
    name: LeeWay Standards Enforcement
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Standards enforcer safety and portability
        run: node --test tests/*.test.mjs

      - name: Run LeeWay File Governance Enforcer (Report Mode)
        id: scan
        run: |
          node scripts/auto-enforce-file-governance.mjs --root . > enforcement-report.json 2>&1
          cat enforcement-report.json
        continue-on-error: true

      - name: Preserve LeeWay file-level governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeway-governance-report
          path: enforcement-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Parse and Validate Compliance Score
        run: |
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('enforcement-report.json', 'utf8'));
          const total = report.scanned || 0;
          const compliant = (report.results || []).filter(item => !item.changed && (!item.validationErrors || item.validationErrors.length === 0)).length;
          const score = total === 0 ? 0 : Math.round((compliant / total) * 100);
          
          console.log('=== LeeWay Standards Enforcement Report ===');
          console.log('Total Files Scanned:', total);
          console.log('Compliant Files:', compliant);
          console.log('Non-Compliant Files:', report.changed || 0);
          console.log('Compliance Score:', score + '%');
          console.log('');
          
          const invalid = report.invalid || 0;
          const flagged = report.changed || 0;
          if (total === 0 || flagged !== 0 || invalid !== 0) {
            console.error('LEEWAY 100% GATE FAILED: every eligible file must pass');
            console.error('Flagged:', flagged, 'Invalid:', invalid, 'Scanned:', total);
            console.error('Review classifications and repair source on a separate branch; do not bulk auto-apply.');
            process.exit(1);
          }
          console.log('LEEWAY 100% GATE PASSED for scanned files; other file classes and runtime bindings require separate qualification');
          "

      - name: Comment PR with Enforcement Results
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('enforcement-report.json', 'utf8'));
            const total = report.scanned || 0;
            const compliant = total - (report.changed || 0);
            const score = total === 0 ? 0 : Math.round((compliant / total) * 100);
            
            const pass = total > 0 && (report.changed || 0) === 0 && (report.invalid || 0) === 0;
            const body = `${pass ? 'PASS' : 'FAIL'} LeeWay 100% scanned-source gate: scanned=${total}, flagged=${report.changed || 0}, invalid=${report.invalid || 0}. No partial-threshold waiver; exemptions and unscanned files require independent qualification.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  blocking-gate:
    runs-on: ubuntu-latest
    name: Admission Gate Validation
    needs: enforce-standards
    if: always()
    steps:
      - name: Verify Enforcement Passed
        if: needs.enforce-standards.result != 'success'
        run: |
          echo "❌ Standards enforcement failed - build cannot proceed"
          exit 1
      - name: ✅ All Gates Passed
        run: |
          echo "✅ Code passed all LeeWay Standards gates"
