name: Creator Authority Security Regression

on:
  pull_request:
    paths:
      - 'src/core/security/creator.authority.ts'
      - 'src/core/security/creator.authority.test.js'
      - '.github/workflows/creator-auth-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail-closed creator authentication negative tests
        run: node --test src/core/security/creator.authority.test.js
