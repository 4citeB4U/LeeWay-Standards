# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.STANDARDS.SH01
# TAG: LEEWAY.STANDARDS.SH01.SNAPSHOT_WORKFLOW
# DISCOVERY_PIPELINE: Voice -> Intent -> Location -> Vertical -> Ranking -> Render
# 5WH:
# WHAT = Validate pinned SH-01 source snapshot, graph and negative regressions
# WHY = Reject fake authority or source CI promotion
# WHO = LeeWay Standards source audit
# WHERE = .github/workflows/sh01-revision-pinned-graph.yml
# WHEN = 2026-10-28
# HOW = Node 22 GitHub Actions source-only
# LICENSE: Existing LeeWay repository terms
name: SH-01 Revision Pinned Dependency Graph
on:
  pull_request:
    paths:
      - 'standards/sh01-main-revision-snapshot.v1.json'
      - 'scripts/verify-sh01-snapshot.mjs'
      - 'tests/sh01-snapshot.test.mjs'
      - '.github/workflows/sh01-revision-pinned-graph.yml'
      - 'standards/SH01_REPOSITORY_REVISION_EVIDENCE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and current pinned source evidence
        run: |
          node --check scripts/verify-sh01-snapshot.mjs
          node --check tests/sh01-snapshot.test.mjs
          node scripts/verify-sh01-snapshot.mjs
      - name: Unique canonical owners, fail-closed gates, dependency DAG
        run: node --test tests/sh01-snapshot.test.mjs
