name: layer-governance

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate-layer-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify canonical checkout scripts and policy exist
        run: |
          test -f .leeway/layer-policy.json
          test -f scripts/check-layer-paths.mjs
          test -f scripts/run-agents.mjs
          test -f scripts/quarantine.mjs
      - name: Run layer path checks
        run: node scripts/check-layer-paths.mjs
      - name: Run SSA scan
        run: node scripts/run-agents.mjs --mode=scan
      - name: Run SSA purge plan
        run: node scripts/run-agents.mjs --mode=purge-plan
      - name: Run SSA quarantine dry-run
        run: node scripts/quarantine.mjs --dry-run
