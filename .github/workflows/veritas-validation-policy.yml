# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.STANDARDS.VERITAS.CI
# TAG: LEEWAY.VERITAS.MEDIUM_FAILURE_RULE_SOURCE_CI
# WHO: Standards source owner; WHAT: structural Veritas V-07 source tests.
# WHEN: 2026-10-27; WHERE: .github/workflows/veritas-validation-policy.yml
# WHY: Prevent false PASS when MEDIUM structural rules fail.
# HOW: Node 22 strip-types imports exact TypeScript source, runs actual test suite.
# AUTHORITY: SOURCE_ONLY, NOT PRODUCTION VERITAS.
# LICENSE: Existing LeeWay Standards terms.
name: Veritas Validation Policy V-07 Proof
on:
  push:
    branches:
      - review/veritas-medium-rule-fail-20261027
    paths:
      - 'src/core/veritas/ValidationPolicy.ts'
      - 'tests/veritas-validation-policy.test.mjs'
      - '.github/workflows/veritas-validation-policy.yml'
  pull_request:
    paths:
      - 'src/core/veritas/ValidationPolicy.ts'
      - 'tests/veritas-validation-policy.test.mjs'
      - '.github/workflows/veritas-validation-policy.yml'
jobs:
  veritas-structural-negative-policy:
    name: V-07 medium severity regression (source only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact TypeScript implementation + nine negative/sibling tests
        run: |
          node --experimental-strip-types --check src/core/veritas/ValidationPolicy.ts
          node --experimental-strip-types --test tests/veritas-validation-policy.test.mjs
